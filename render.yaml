# Creates HRD resources only. No EFM resource is referenced or changed.
services:
  - type: web
    name: hrd-pilot-web
    runtime: static
    buildCommand: npm ci --include=dev && npm run build -w frontend
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://hrd-pilot-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /api/*
        name: Cache-Control
        value: no-store
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
  - type: web
    name: hrd-pilot-api
    runtime: node
    region: singapore
    buildCommand: npm ci --include=dev && npm run build -w backend
    preDeployCommand: npm run db:migrate
    startCommand: npm run start -w backend -- --port $PORT
    healthCheckPath: /api/health
    envVars:
      - fromGroup: hrd-pilot-settings
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: hrd-pilot-data
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.3
  - type: cron
    name: hrd-pilot-sync
    runtime: node
    region: singapore
    schedule: '*/5 * * * *'
    buildCommand: npm ci --include=dev
    startCommand: npm run sync
    envVars:
      - fromGroup: hrd-pilot-settings
      - key: DATABASE_URL
        fromDatabase:
          name: hrd-pilot-data
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.3
databases:
  - name: hrd-pilot-data
    region: singapore
    databaseName: hrd
    user: hrd
    ipAllowList: []
envVarGroups:
  - name: hrd-pilot-settings
    envVars:
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: EFM_ALLOWED_HOSTS
        value: efm.eirs.app
