name: HRD tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hrd_test
          POSTGRES_PASSWORD: hrd_test
          POSTGRES_DB: hrd_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # Uses the pnpm version pinned in package.json "packageManager".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Database tests skip silently without HRD_TEST_DATABASE_URL; set it so they always run here.
      - run: pnpm test
        env:
          HRD_TEST_DATABASE_URL: postgresql://hrd_test:hrd_test@localhost:5432/hrd_test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:ui
